name: Keep Render Backend Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from sleeping (sleeps after 15m)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Pinging https://indiafy-1.onrender.com/health..."
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" https://indiafy-1.onrender.com/health
