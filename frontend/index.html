<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- SEO Meta Tags -->
    <title>Indiafy - The Modern Marketplace for Everything</title>
    <meta name="description" content="Indiafy is your premier destination for local shopping, quick commerce, and premium products. Experience fast delivery and exceptional quality." />
    <meta name="keywords" content="marketplace, online shopping, ecommerce, local sellers, quick commerce, Indiafy" />
    <meta name="author" content="Indiafy" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#10B981" />
    <meta name="google-site-verification" content="CEg1FKoq8TiBK1XCzSGX7tmJjs3M9timqxJxumKy1dY" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://india-fy.vercel.app/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://india-fy.vercel.app/" />
    <meta property="og:title" content="Indiafy - The Modern Marketplace for Everything" />
    <meta property="og:description" content="Indiafy is your premier destination for local shopping, quick commerce, and premium products." />
    <meta property="og:site_name" content="Indiafy" />
    <meta property="og:locale" content="en_IN" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://india-fy.vercel.app/" />
    <meta name="twitter:title" content="Indiafy - The Modern Marketplace for Everything" />
    <meta name="twitter:description" content="Indiafy is your premier destination for local shopping, quick commerce, and premium products." />

    <!-- Fonts: preconnect + preload critical font for LCP -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@400;500;600;700;800;900&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <!-- Preload Critical Assets for LCP -->
    <link rel="preload" as="image" href="/Images/logo.png" />
    <link rel="preload" as="image" href="https://static-assets-web.flixcart.com/fk-p-linchpin-web/fk-cp-zion/img/grocery_bg_b219fb.jpg" />

    <link rel="icon" type="image/png" href="/fabicon.png" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Indiafy",
      "url": "https://india-fy.vercel.app",
      "logo": "https://india-fy.vercel.app/Images/logo.png",
      "description": "Indiafy is a trust-first hyperlocal commerce infrastructure. Discover local sellers, quick commerce, and wholesale B2B.",
      "sameAs": []
    }
    </script>
  </head>
  <body class="antialiased bg-[#F8FAFC] text-[#0F172A] transition-colors duration-300">
    <div id="root">
      <style>
        .initial-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          background-color: #F8FAFC;
          font-family: 'Inter', sans-serif;
        }
        .spinner {
          width: 50px;
          height: 50px;
          border: 4px solid rgba(16, 185, 129, 0.2);
          border-left-color: #10B981;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 20px;
        }
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        .brand-text {
          font-size: 24px;
          font-weight: 900;
          color: #0F172A;
          letter-spacing: -0.5px;
        }
      </style>
      <div class="initial-loader">
        <div class="spinner"></div>
        <div class="brand-text">indiafy</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
